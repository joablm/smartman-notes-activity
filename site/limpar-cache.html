<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atualizando Humanevo</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f7f5;color:#173c39;font-family:Inter,Segoe UI,Arial,sans-serif}.card{width:min(520px,calc(100% - 32px));padding:34px;border-radius:26px;background:white;box-shadow:0 24px 70px rgba(16,55,51,.14);text-align:center}.mark{width:64px;height:64px;border-radius:20px;margin:0 auto 18px;display:grid;place-items:center;background:#dff7f1;font-size:28px;font-weight:900}.bar{height:8px;border-radius:99px;background:#e5efec;overflow:hidden;margin-top:20px}.bar:after{content:'';display:block;height:100%;width:45%;background:#23a995;animation:move 1.1s infinite ease-in-out}@keyframes move{50%{transform:translateX(120%)}}</style><link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png?v=3.10.8">
<link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png?v=3.10.8">
<link rel="apple-touch-icon" href="assets/favicon-180.png?v=3.10.8">
</head>
<body><main class="card"><div class="mark">H</div><h1>Atualizando a plataforma</h1><p>Estamos removendo arquivos antigos do navegador. Você será direcionado para a versão corrigida.</p><div class="bar"></div></main>
<script>(async()=>{try{if('serviceWorker'in navigator){const r=await navigator.serviceWorker.getRegistrations();await Promise.all(r.map(x=>x.unregister()))}if('caches'in window){const k=await caches.keys();await Promise.all(k.map(x=>caches.delete(x)))}}catch(e){}localStorage.removeItem('humanevo_redirect_guard');const portal=new URLSearchParams(location.search).get('dest')==='portal';setTimeout(()=>location.replace(portal?'/portal-paciente?v=3.10.8':'/painel?v=3.10.8'),900)})();</script><!-- Cloudflare Pages Analytics --><script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "2c0a4800463d458b840c3541bd11fb5f"}'></script><!-- Cloudflare Pages Analytics --></body></html>
