name: Package Humanevo V4.1.0

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  package:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.title, 'Package Humanevo')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          node --check site/app.js
          node --check site/cloud.js
          node --check site/care-network.js
          node --check site/sw.js
      - name: Validate required files
        run: |
          test -f site/painel.html
          test -f site/care-network.js
          test -f site/care-network.css
          test -f site/HUMANEVO_V4_1_0_REDE_CUIDADO.sql
          grep -q 'care-network.js?v=4.1.0' site/painel.html
          grep -q "humanevo-premium-studio-v4-1-0" site/sw.js
      - name: Create deployment ZIP
        run: |
          rm -rf releases
          mkdir -p releases
          cd site
          zip -r ../releases/Humanevo_Premium_Studio_V4_1_0_REDE_CUIDADO_ESCOLA.zip . -x '*.DS_Store' -x '__MACOSX/*'
          cd ..
          sha256sum releases/Humanevo_Premium_Studio_V4_1_0_REDE_CUIDADO_ESCOLA.zip > releases/SHA256_V4_1_0.txt
          echo "${{ github.run_id }}" > releases/RUN_ID.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Humanevo-V4.1.0
          path: releases/
          retention-days: 30
      - name: Commit validated package
        run: |
          git config user.name "OpenAI Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add releases
          git commit -m "Build Humanevo V4.1.0 package with run ID" || true
          git push
